info:
  name: checkActivation
  type: http
  seq: 2
  tags:
    - activate-controller

http:
  method: GET
  url: "{{baseUrl}}/api/v1/auth/activate/:token"
  params:
    - name: token
      value: ""
      type: path
  auth: inherit

