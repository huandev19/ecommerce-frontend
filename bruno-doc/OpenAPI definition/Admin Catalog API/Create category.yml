info:
  name: Create category
  type: http
  seq: 15
  tags:
    - Admin Catalog API

http:
  method: POST
  url: "{{baseUrl}}/api/admin/categories"
  body:
    type: json
    data: |-
      {
        "name": "",
        "slug": "",
        "description": "",
        "parentCategoryId": "",
        "active": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

