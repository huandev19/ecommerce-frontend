info:
  name: refreshToken
  type: http
  seq: 2
  tags:
    - auth-controller

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/refresh"
  headers:
    - name: Authorization
      value: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/auth/refresh"
      method: POST
      headers:
        - name: Authorization
          value: ""
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "success": false,
            "message": "",
            "data": {
              "accessToken": "",
              "refreshToken": "",
              "tokenType": "",
              "expiresIn": 0,
              "user": {
                "id": "",
                "email": "",
                "firstName": "",
                "lastName": "",
                "fullName": "",
                "phone": "",
                "avatarUrl": "",
                "status": "",
                "emailVerified": false,
                "createdAt": "",
                "lastLoginAt": ""
              }
            },
            "timestamp": "",
            "errors": {}
          }
